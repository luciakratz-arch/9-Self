<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>9&Self — Sem conexão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0d0618;
      color: #e8d8ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      color: #e8d8ff;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .logo span { color: rgba(196,166,232,0.6); }
    .icon {
      font-size: 56px;
      margin: 32px 0 24px;
      opacity: 0.7;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: rgba(232,216,255,0.55);
      max-width: 320px;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #7B00C4, #9c27b0);
      color: #fff;
      padding: 14px 36px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 20px rgba(123,0,196,0.4);
    }
    .hint {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(196,166,232,0.3);
    }
  </style>
</head>
<body>
  <div class="logo">9<span>&</span>Self</div>
  <div class="icon">📡</div>
  <h1>Você está sem conexão</h1>
  <p>Verifique sua internet e tente novamente. O 9&Self precisa de conexão para carregar seu perfil e laudo.</p>
  <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
  <p class="hint">Quando a conexão voltar, o app retoma normalmente.</p>
</body>
</html>
